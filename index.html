<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <title>Aplicación Web</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #ffffff;
      font-family: Arial, sans-serif;
    }
    /* Pantalla de carga mientras se inicializa la aplicación */
    #loader {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background-color: #ffffff;
      z-index: 10;
      transition: opacity 0.4s ease;
    }
    .spinner {
      width: 45px;
      height: 45px;
      border: 5px solid #f3f3f3;
      border-top: 5px solid #1a73e8;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-bottom: 15px;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    #loader p {
      color: #5f6368;
      font-size: 14px;
    }
    iframe {
      width: 100%;
      height: 100vh;
      border: none;
      display: block;
    }
  </style>
</head>
<body>

  <div id="loader">
    <div class="spinner"></div>
    <p>Cargando aplicación...</p>
  </div>

  <iframe 
    id="appFrame"
    src="https://script.google.com/macros/s/AKfycbwmtGp00JgX-FK2lvieWKx07JC7OjmOUhkUR6e-P-CJZ_ISWgQlISx1POMbjHTBmXXM/exec" 
    title="Aplicación Google Apps Script"
    allow="geolocation; microphone; camera; display-capture; autoplay; clipboard-write"
    onload="hideLoader()">
  </iframe>

  <script>
    function hideLoader() {
      const loader = document.getElementById('loader');
      if (loader) {
        loader.style.opacity = '0';
        setTimeout(() => {
          loader.style.display = 'none';
        }, 400);
      }
    }
  </script>

</body>
</html>
