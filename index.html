<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Floristería Díaz</title>
  <meta name="description" content="Catálogo de Floristería Díaz">
  <meta name="theme-color" content="#6f263d">
  <meta name="robots" content="noindex,nofollow">
  <link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
  <link rel="apple-touch-icon" sizes="192x192" href="./icon-192.png">
  <link rel="manifest" href="./manifest.webmanifest">
  <style>
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#fff}
    iframe{display:block;width:100%;height:100%;border:0}
  </style>
</head>
<body>
  <iframe id="app" title="Floristería Díaz" allow="fullscreen"
    loading="eager" referrerpolicy="strict-origin-when-cross-origin"></iframe>
  <script>
    (function(){
      var publicUrl = "https://script.google.com/macros/s/AKfycbwmtGp00JgX-FK2lvieWKx07JC7OjmOUhkUR6e-P-CJZ_ISWgQlISx1POMbjHTBmXXM/exec";
      var adminUrl = publicUrl + "?p=admin";
      var params = new URLSearchParams(window.location.search);
      document.getElementById("app").src =
        params.get("p") === "admin" ? adminUrl : publicUrl;
    })();
  </script>
</body>
</html>
